<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="kurobe/kurobe.css">
  <link rel="stylesheet" href="kurobe/components.css">
  <link rel="stylesheet" href="little.css">
  <style id="ranga-theme"></style>
</head>
<body class="k-type-body">
  <header id="bar" class="bar" role="toolbar" aria-label="Janela pequena">
    <span id="leading" class="leading"></span>
    <span class="text">
      <span id="title" class="title k-type-label"></span>
      <span id="host" class="host k-type-caption"></span>
    </span>
    <button id="main" class="k-button k-button--tonal k-type-button main" title="Mover pra janela principal do Ranga"><span class="k-icon" data-icon="panel-left"></span>Abrir no Ranga</button>
    <button id="close" class="k-icon-button k-state" title="Fechar janela" data-icon="x"></button>
  </header>
  <script type="module" src="little.js"></script>
</body>
</html>
