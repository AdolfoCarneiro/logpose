<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="kurobe/kurobe.css">
  <link rel="stylesheet" href="kurobe/components.css">
  <link rel="stylesheet" href="peek.css">
  <style id="logpose-theme"></style>
</head>
<body class="k-type-body closed">
  <div id="scrim" class="scrim"></div>
  <div class="stage"><div id="ghost" class="ghost"></div></div>
  <header id="toolbar" class="toolbar" role="toolbar" aria-label="Peek">
    <span id="leading" class="leading"></span>
    <span class="text">
      <span id="title" class="title k-type-label"></span>
      <span id="host" class="host k-type-caption"></span>
    </span>
    <button id="promote" class="k-button k-button--tonal k-type-button promote" title="Abrir como aba (Ctrl+Enter)"><span class="k-icon" data-icon="app-window"></span>Abrir como aba</button>
    <button id="close" class="k-icon-button k-state" title="Fechar (Esc)" data-icon="x"></button>
  </header>
  <script type="module" src="peek.js"></script>
</body>
</html>
