<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="icon-128.png">
  <title>Nova aba</title>
  <link rel="stylesheet" href="kurobe/kurobe.css">
  <link rel="stylesheet" href="kurobe/components.css">
  <link rel="stylesheet" href="newtab.css">
  <style id="logpose-theme"></style>
</head>
<body class="k-type-body">
  <main class="feed">
    <header class="hello">
      <div class="hello__text">
        <h1 id="greeting" class="hello__greeting"></h1>
        <p id="date" class="hello__date k-type-panel"></p>
      </div>
      <div id="now" class="now" hidden>
        <span id="now-icon" class="k-icon now__icon"></span>
        <span class="now__text">
          <span id="now-temp" class="now__temp"></span>
          <span id="now-label" class="k-type-caption now__label"></span>
        </span>
      </div>
    </header>

    <label id="search" class="search k-state k-type-label">
      <span class="k-icon" data-icon="search"></span>
      <input id="search-input" class="search__text" type="text" placeholder="Buscar ou digitar endereço" autocomplete="off" spellcheck="false" autofocus>
      <span id="keys" class="keys"></span>
    </label>

    <nav id="shortcuts" class="shortcuts" aria-label="Atalhos"></nav>

    <section id="market" class="market" hidden>
      <header class="news__head">
        <h2 class="section-title">Mercado</h2>
        <button id="market-refresh" class="k-icon-button k-state" type="button" title="Atualizar" data-icon="rotate-cw"></button>
      </header>
      <div id="market-state" class="news__state"></div>
      <div id="market-list" class="indicators"></div>
      <div class="holdings">
        <article id="stocks" class="card holding" hidden>
          <header class="card__head">
            <span class="k-icon" data-icon="chart-candlestick"></span>
            <h2 class="k-type-panel">Ações</h2>
          </header>
          <ul id="stocks-list" class="assets"></ul>
        </article>
        <article id="funds" class="card holding" hidden>
          <header class="card__head">
            <span class="k-icon" data-icon="building-2"></span>
            <h2 class="k-type-panel">FIIs</h2>
          </header>
          <ul id="funds-list" class="assets"></ul>
        </article>
      </div>
      <button id="market-add" class="k-button k-button--text k-type-button market__add" type="button" hidden>Escolher ações e FIIs</button>
    </section>

    <section id="news" class="news" hidden>
      <header class="news__head">
        <h2 class="section-title">Notícias</h2>
        <button id="news-refresh" class="k-icon-button k-state" type="button" title="Atualizar" data-icon="rotate-cw"></button>
      </header>
      <div id="news-state" class="news__state"></div>
      <div id="news-list" class="news__list"></div>
    </section>
  </main>
  <script type="module" src="newtab.js"></script>
</body>
</html>
